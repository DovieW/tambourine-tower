[package]
name = "kolboo"
version = "0.2.5-beta.1"
description = "Customizable AI-powered voice dictation tool"
license = "AGPL-3.0"
authors = ["kstonekuan"]
edition = "2021"
default-run = "kolboo"
autobins = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "kolboo_lib"
doctest = false

[workspace]
members = ["xtask"]
resolver = "2"

[features]
default = []
# Enable local Whisper STT (requires whisper.cpp build dependencies)
local-whisper = ["dep:whisper-rs", "dep:dirs"]

# Local Whisper build variant: compile whisper.cpp with CUDA support.
#
# This enables GPU acceleration on supported systems, but requires the CUDA toolkit
# and a working C/C++ toolchain for building whisper.cpp.
local-whisper-cuda = ["local-whisper", "whisper-rs/cuda"]

[build-dependencies]
# Keep Rust-side Tauri crates on the 2.11/2.6 minor lines that the JS packages
# in app/package.json are intentionally pinned to. Cargo's default caret ranges
# can drift to newer minors and then `tauri build` rejects the mismatch.
tauri-build = { version = "~2.6.3", features = [] }
serde_json = "1.0.151"

[dependencies]
tauri = { version = "~2.11.5", default-features = false, features = [
    "wry",
    "compression",
    "common-controls-v6",
    "tray-icon",
    "macos-private-api",
    "image-png",
    "devtools",
] }
tauri-utils = "~2.9.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "~2.11.0"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-cli = "~2.4.1"
# IMPORTANT: Tauri CLI enforces that the JS package (@tauri-apps/plugin-dialog)
# and the Rust crate (tauri-plugin-dialog) match on major/minor. Cargo's default
# caret requirement can drift to a newer minor and break CI when the JS plugin
# has not moved with it.
tauri-plugin-dialog = "~2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
log = "0.4.33"
schemars = { version = "0.8.22", features = ["derive", "chrono"] }

# Structured tracing (spans + JSON logs). We keep `log` for third-party crates,
# but route it into `tracing` so spans/fields can correlate everything.
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
sentry = "0.49.1"

# Keyboard automation
enigo = "0.6.1"
arboard = "3.6.1"

# Async runtime
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }  # CancellationToken

# Settings and history
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# Audio playback
rodio = { version = "0.22.2", default-features = false, features = [
    "mp3",
    "playback",
] }

# Audio capture
cpal = "0.18.2"
hound = "3.5"  # WAV encoding

# Voice Activity Detection
webrtc-vad = "0.4"
rubato = "5.0"  # High-quality audio resampling
audioadapter-buffers = "5.2"  # Adapters for rubato 1.x buffer API

# Local Whisper (whisper.cpp bindings) - Optional feature
whisper-rs = { version = "0.16", optional = true }
dirs = { version = "6.0", optional = true }  # For model storage paths

# HTTP client for STT/LLM API calls
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
dotenvy = "0.15"

# Hashing (used for validating downloaded local Whisper model files)
sha2 = "0.11"

# WebSocket client (Speechmatics realtime STT)
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = { version = "0.2.18", features = ["vendored"] }
futures-util = "0.3"

# Base64 encoding for audio data
base64 = "0.23"

# Image processing (active-window OCR capture)
image = { version = "0.25", default-features = false, features = ["png"] }

# Zip archive creation (diagnostics export)
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }

# Async utilities
async-trait = "0.1"

# Lock-free queues (used to avoid allocations in realtime audio callbacks)
crossbeam-queue = "0.3"

# Error handling
thiserror = "2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.1"
open = "5.4.1"

# Windows audio control (WASAPI)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32",
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_Devices",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Gdi",
    "Win32_System",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Xps",
] }
keyring = { version = "3", features = ["windows-native"] }

# macOS audio control (CoreAudio) and NSPanel for overlay
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
gdk = "0.18.2"
gtk = "0.18.2"
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
wiremock = "0.6.5"

# Compile dependencies with optimizations even in dev/test builds.
# This dramatically speeds up `cargo test` for heavy deps (windows, tauri,
# reqwest, rubato, etc.) and makes the benchmark tests ~10-20x faster.
[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "kolboo"
path = "src/main.rs"
# Avoid building the full Tauri app binary as a test harness during `cargo test`.
test = false
bench = false

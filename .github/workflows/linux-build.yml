name: Linux Build

on:
  pull_request:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      TAURI_SENTRY_DSN:
        required: false
    outputs:
      artifact-name:
        description: "Name of the packaged Linux artifact"
        value: ${{ jobs.build-linux.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-22.04
    outputs:
      artifact-name: ${{ steps.build-meta.outputs.artifact-name }}

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      TAURI_API_BASE_URL: https://kolboo.dovie.dev
      TAURI_MANAGED_INFERENCE_GATEWAY_URL: https://kolboo.dovie.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Compute Linux build metadata
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=kolboo@${version}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=kolboo-linux-x86_64-${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Require runtime crash reporting for a beta tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SENTRY_DSN: ${{ secrets.TAURI_SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SENTRY_DSN" ]]; then
            echo "TAURI_SENTRY_DSN must be configured before publishing a Linux beta." >&2
            exit 1
          fi

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-linux-build-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-build-sccache-
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Build Linux packages
        working-directory: app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: kolboo-public-dev
          SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          TAURI_APP_VERSION: ${{ steps.build-meta.outputs.version }}
          TAURI_SENTRY_DSN: ${{ secrets.TAURI_SENTRY_DSN }}
          TAURI_SENTRY_ENV: beta
          TAURI_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SENTRY_ENV: beta
          VITE_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SIGNED_UPDATER_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          pnpm tauri build --no-sign --bundles deb,appimage

      - name: Verify and package Linux artifacts
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          binary="app/src-tauri/target/release/kolboo"
          bundle_root="app/src-tauri/target/release/bundle"
          deb_path=$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage_path=$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)

          if [[ -z "$deb_path" || -z "$appimage_path" ]]; then
            echo "Expected both .deb and AppImage bundles under $bundle_root" >&2
            find "$bundle_root" -maxdepth 3 -print || true
            exit 1
          fi

          test -x "$binary"
          ldd "$binary" | tee linux-binary-dependencies.txt
          if grep -q "not found" linux-binary-dependencies.txt; then
            echo "The Linux binary has unresolved shared-library dependencies." >&2
            exit 1
          fi

          dpkg-deb --info "$deb_path"
          dpkg-deb --contents "$deb_path" > linux-deb-contents.txt
          chmod +x "$appimage_path"
          appimage_extract_dir=$(mktemp -d)
          (
            cd "$appimage_extract_dir"
            "$GITHUB_WORKSPACE/$appimage_path" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
          )

          mkdir -p artifacts
          cp "$deb_path" artifacts/
          cp "$appimage_path" artifacts/
          cp linux-binary-dependencies.txt linux-deb-contents.txt artifacts/
          (
            cd artifacts
            sha256sum ./*.deb ./*.AppImage > SHA256SUMS
          )

          cat > artifacts/build-evidence.txt <<EOF
          release=${{ steps.build-meta.outputs.release }}
          channel=linux-community-beta
          architecture=x86_64
          build_runner=ubuntu-22.04
          updater_enabled=false
          git_ref=${GITHUB_REF}
          git_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-meta.outputs.artifact-name }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

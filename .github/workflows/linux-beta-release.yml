name: Linux Community Beta Release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify beta version and release notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify versions match the beta tag
        run: node .github/scripts/verify-versions.mjs

      - name: Generate release notes from changelog.d
        run: node .github/scripts/generate-release-notes.mjs RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-beta-release-notes
          if-no-files-found: error
          path: RELEASE_NOTES.md

  build-linux:
    name: Build Linux Community beta
    needs: verify
    uses: ./.github/workflows/linux-build.yml
    secrets: inherit

  publish:
    name: Publish Linux Community beta
    needs:
      - verify
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-beta-release-notes
          path: .release

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-linux.outputs.artifact-name }}
          path: .release/linux

      - name: Attest Linux package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/linux/*.deb
            .release/linux/*.AppImage

      - name: Create prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Kolboo ${{ github.ref_name }} - Linux Community Beta
          body_path: .release/RELEASE_NOTES.md
          files: .release/linux/**
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false

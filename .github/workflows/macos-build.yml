name: macOS Development Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture for the private test artifact"
        required: true
        type: choice
        default: apple-silicon
        options:
          - apple-silicon
          - intel
          - universal

permissions:
  contents: read

concurrency:
  group: macos-development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}

    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      TAURI_API_BASE_URL: https://kolboo.dovie.dev
      TAURI_MANAGED_INFERENCE_GATEWAY_URL: https://kolboo.dovie.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select native build target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.architecture }}" in
            apple-silicon)
              echo "KOLBOO_BUILD_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=apple-silicon" >> "$GITHUB_ENV"
              ;;
            intel)
              echo "KOLBOO_BUILD_TARGET=x86_64-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=intel" >> "$GITHUB_ENV"
              ;;
            universal)
              echo "KOLBOO_BUILD_TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
              echo "KOLBOO_ARTIFACT_SUFFIX=universal" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported architecture: ${{ inputs.architecture }}" >&2
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable project pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./app/package.json').packageManager")" --activate

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Compute development build metadata
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./app/package.json').version")
          short_sha="${GITHUB_SHA::7}"
          echo "release=kolboo@${version}-macos-dev.${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target
          shared-key: macos-${{ runner.arch }}-${{ inputs.architecture }}

      - name: Build ad-hoc-signed macOS bundles
        working-directory: app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: kolboo-public-dev
          SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          TAURI_SENTRY_ENV: development
          TAURI_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SENTRY_ENV: development
          VITE_SENTRY_RELEASE: ${{ steps.build-meta.outputs.release }}
          VITE_SIGNED_UPDATER_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC_WRAPPER=sccache
          pnpm tauri build \
            --target "$KOLBOO_BUILD_TARGET" \
            --config src-tauri/tauri.macos-development.conf.json

      - name: Locate and verify bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="app/src-tauri/target/$KOLBOO_BUILD_TARGET/release/bundle"
          app_path=$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)

          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "Expected both an application bundle and a DMG under $bundle_root" >&2
            find "$bundle_root" -maxdepth 3 -print || true
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          executable="$app_path/Contents/MacOS/kolboo"
          test -x "$executable"
          file "$executable"
          lipo -info "$executable"

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Package downloadable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.bundles.outputs.app_path }}" \
            "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.app.zip"
          cp "${{ steps.bundles.outputs.dmg_path }}" \
            "artifacts/Kolboo-${KOLBOO_ARTIFACT_SUFFIX}.dmg"

          cat > artifacts/build-evidence.txt <<EOF
          architecture=${{ inputs.architecture }}
          build_target=${KOLBOO_BUILD_TARGET}
          signing=ad-hoc
          updater_enabled=false
          git_ref=${GITHUB_REF}
          git_sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload macOS development bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kolboo-macos-${{ inputs.architecture }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/**

name: Build (Windows)

on:
  workflow_call:
    inputs:
      build_local_whisper:
        description: "Whether to build and upload the local-whisper Windows bundle artifact"
        required: false
        type: boolean
        default: true
      release_signing:
        description: "Generate signed updater artifacts for a public release"
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name-default:
        description: "Name of the uploaded Windows bundle artifact (default build)"
        value: ${{ jobs.build-windows.outputs.artifact-name-default }}
      artifact-name-local-whisper:
        description: "Name of the uploaded Windows bundle artifact (with local-whisper feature). Empty when build_local_whisper=false."
        value: ${{ jobs.build-windows.outputs.artifact-name-local-whisper }}
  workflow_dispatch:
    inputs:
      build_local_whisper:
        description: "Whether to build and upload the local-whisper Windows bundle artifact"
        required: false
        type: boolean
        default: true
      release_signing:
        description: "Generate signed updater artifacts for a public release"
        required: false
        type: boolean
        default: false

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    # Lightweight PR/branch checks (kept separate from release bundling).
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      # Use a local sccache directory and cache it via actions/cache.
      # This avoids relying on GitHub's artifact cache service, which can be flaky.
      SCCACHE_DIR: ${{ github.workspace }}\\.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read pnpm version (from app/package.json)
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "require('./app/package.json').packageManager.split('@')[1]")
          echo "pnpm_version=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm (Corepack)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ steps.pnpm-version.outputs.pnpm_version }} --activate
          pnpm -v

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target-ci

      - name: Run checks (check:ci)
        shell: bash
        run: |
          set -euo pipefail
          # Debug tests are substantially faster than --release on Windows, and jobs
          # don't share build outputs anyway. Keep the workflow fast.
          if sccache --version >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
            echo "Using sccache: $(sccache --version)"
            sccache --show-stats || true
          else
            echo "sccache not available; running tests without compiler cache"
          fi

          pushd app >/dev/null
          pnpm check:ci
          popd >/dev/null

          sccache --show-stats || true

  build-windows:
    # Build bundles for tags (releases) and manual runs.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_call' }}
    runs-on: windows-latest

    outputs:
      artifact-name-default: ${{ steps.artifact-meta.outputs.artifact_name_default }}
      artifact-name-local-whisper: ${{ steps.artifact-meta.outputs.artifact_name_local_whisper }}

    env:
      CARGO_TERM_COLOR: always
      # Use a local sccache directory and cache it via actions/cache.
      # This avoids relying on GitHub's artifact cache service, which can be flaky.
      SCCACHE_DIR: ${{ github.workspace }}\\.sccache
      # Release bundling now hard-fails when the desktop cloud endpoints are missing.
      # These are public, non-secret origins, so keep CI explicit instead of relying on
      # a developer-local .env file that GitHub Actions will never see.
      TAURI_API_BASE_URL: https://kolboo.dovie.dev
      TAURI_MANAGED_INFERENCE_GATEWAY_URL: https://kolboo.dovie.dev

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read pnpm version (from app/package.json)
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "require('./app/package.json').packageManager.split('@')[1]")
          echo "pnpm_version=${pnpm_version}" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm (Corepack)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ steps.pnpm-version.outputs.pnpm_version }} --activate
          pnpm -v

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Compute Sentry build metadata
        id: sentry-meta
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./app/package.json').version")
          short_sha="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            project="kolboo-public-prod"
            environment="production"
            release="kolboo@${GITHUB_REF_NAME#v}"
          else
            project="kolboo-public-dev"
            environment="development"
            release="kolboo@${version}-dev.${short_sha}"
          fi

          echo "project=${project}" >> "$GITHUB_OUTPUT"
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Require updater signing credentials for releases
        if: ${{ inputs.release_signing }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "Release blocked: Tauri updater signing secrets are not configured." >&2
            exit 1
          fi

      - name: Require Windows publisher credentials for releases
        if: ${{ inputs.release_signing }}
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${WINDOWS_CERTIFICATE}" || -z "${WINDOWS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Release blocked: provision WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD before publishing Windows installers." >&2
            exit 1
          fi

      - name: Import Windows publisher certificate
        if: ${{ inputs.release_signing }}
        id: windows-certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "kolboo-release-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate.HasPrivateKey) { throw "Imported certificate has no private key." }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Write Windows signing configuration
        if: ${{ inputs.release_signing }}
        shell: bash
        run: |
          set -euo pipefail
          config_path="${RUNNER_TEMP}/kolboo-windows-signing.json"
          node .github/scripts/write-windows-signing-config.mjs "$config_path" "${{ steps.windows-certificate.outputs.thumbprint }}"
          echo "WINDOWS_SIGNING_CONFIG=${config_path}" >> "$GITHUB_ENV"

      - name: Build Tauri app (release) - default
        working-directory: app
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: ${{ steps.sentry-meta.outputs.project }}
          SENTRY_RELEASE: ${{ steps.sentry-meta.outputs.release }}
          TAURI_SENTRY_ENV: ${{ steps.sentry-meta.outputs.environment }}
          TAURI_SENTRY_RELEASE: ${{ steps.sentry-meta.outputs.release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_signing && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_signing && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          VITE_SIGNED_UPDATER_ENABLED: ${{ inputs.release_signing && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if sccache --version >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
            echo "Using sccache: $(sccache --version)"
            sccache --show-stats || true
          else
            echo "sccache not available; building without compiler cache"
          fi

          if [[ "${{ inputs.release_signing }}" == "true" ]]; then
            pnpm tauri build --config "${WINDOWS_SIGNING_CONFIG}"
          else
            pnpm build
          fi

          sccache --show-stats || true

      - name: Collect bundles (default)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows-default
          cp -R app/src-tauri/target/release/bundle artifacts/windows-default/ || true
          shopt -s nullglob
          cp app/src-tauri/target/release/*.exe artifacts/windows-default/ || true

      - name: Build Tauri app (release) - with local-whisper
        if: ${{ inputs.build_local_whisper }}
        working-directory: app
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dov-weinstock
          SENTRY_PROJECT: ${{ steps.sentry-meta.outputs.project }}
          SENTRY_RELEASE: ${{ steps.sentry-meta.outputs.release }}
          TAURI_SENTRY_ENV: ${{ steps.sentry-meta.outputs.environment }}
          TAURI_SENTRY_RELEASE: ${{ steps.sentry-meta.outputs.release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_signing && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_signing && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          VITE_SIGNED_UPDATER_ENABLED: ${{ inputs.release_signing && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if sccache --version >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
            echo "Using sccache: $(sccache --version)"
            sccache --show-stats || true
          else
            echo "sccache not available; building without compiler cache"
          fi

          # Reuse the repo's own local-whisper build script so CI follows the
          # exact same invocation path developers use locally.
          if [[ "${{ inputs.release_signing }}" == "true" ]]; then
            pnpm tauri build --config "${WINDOWS_SIGNING_CONFIG}" --features local-whisper
          else
            pnpm build:local-whisper
          fi

          sccache --show-stats || true

      - name: Collect bundles (local-whisper)
        if: ${{ inputs.build_local_whisper }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows-local-whisper
          cp -R app/src-tauri/target/release/bundle artifacts/windows-local-whisper/ || true
          shopt -s nullglob
          cp app/src-tauri/target/release/*.exe artifacts/windows-local-whisper/ || true

      - name: Verify Authenticode signatures
        if: ${{ inputs.release_signing }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Get-ChildItem -Path artifacts -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          if (-not $artifacts) { throw "No Windows executables or installers were collected." }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $($artifact.Name): $($signature.Status)"
            }
          }

      - name: Set artifact metadata
        id: artifact-meta
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_name_default=kolboo-windows-bundles" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.build_local_whisper }}" == "true" ]]; then
            echo "artifact_name_local_whisper=kolboo-windows-bundles-local-whisper" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_name_local_whisper=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Windows build evidence summary
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          sentry_upload_enabled=false
          if [[ -n "${SENTRY_AUTH_TOKEN}" ]]; then
            sentry_upload_enabled=true
          fi

          cat <<EOF > windows-build-evidence.txt
          sentry_project=${{ steps.sentry-meta.outputs.project }}
          sentry_environment=${{ steps.sentry-meta.outputs.environment }}
          sentry_release=${{ steps.sentry-meta.outputs.release }}
          sentry_upload_enabled=${sentry_upload_enabled}
          bundle_artifact_default=${{ steps.artifact-meta.outputs.artifact_name_default }}
          bundle_artifact_local_whisper=${{ steps.artifact-meta.outputs.artifact_name_local_whisper }}
          build_local_whisper=${{ inputs.build_local_whisper }}
          git_ref=${{ github.ref }}
          git_sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Windows build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-evidence
          if-no-files-found: error
          path: windows-build-evidence.txt

      - name: Upload bundles (default)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kolboo-windows-bundles
          if-no-files-found: error
          path: |
            artifacts/windows-default/**

      - name: Upload bundles (local-whisper)
        if: ${{ inputs.build_local_whisper }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kolboo-windows-bundles-local-whisper
          if-no-files-found: error
          path: |
            artifacts/windows-local-whisper/**
